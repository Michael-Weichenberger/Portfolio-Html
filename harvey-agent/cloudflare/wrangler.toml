# Cloudflare Worker für den Live-Sichtbarkeits-Check
# Deploy: siehe harvey-agent/README.md, Abschnitt "Cloudflare Worker"
name = "mw-sichtbarkeit"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://mw-itservices.de,https://www.mw-itservices.de"

# Max. 10 Messungen pro Minute und IP (schützt das PageSpeed-Kontingent)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Secret (nicht hier eintragen!):  npx wrangler secret put PSI_API_KEY --config cloudflare/wrangler.toml
